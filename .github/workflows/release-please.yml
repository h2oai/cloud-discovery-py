name: Release Please
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    permissions:
      contents: write # Pushes to the repo and creates release.
      pull-requests: write # Opens PR.

    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  release-pypi:
    name: Release to PyPI
    uses: ./.github/workflows/pypi-release.yml

    if: needs.release-please.outputs.releases_created == 'true'
    needs: release-please

    permissions:
      contents: read
      id-token: write # Logs in to PyPI.

  release-api-docs:
    name: Attach API Docs to Release
    uses: ./.github/workflows/api-docs-release.yml

    if: needs.release-please.outputs.releases_created == 'true'
    needs: release-please

    permissions:
      contents: write # Uploads release assets.

    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
